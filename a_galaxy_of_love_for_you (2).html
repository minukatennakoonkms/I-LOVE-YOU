<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Galaxy of Love for You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    /* Fullscreen 3D Canvas */
    #galaxy-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      touch-action: none;
    }

    /* Intro Overlay */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(circle at 50% 45%, rgba(42, 8, 36, 0.45) 0%, rgba(0, 0, 0, 0.94) 70%, #000000 100%);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    #intro-screen.fade-out {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    .intro-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.1rem, 6vw, 3.6rem);
      font-weight: 700;
      line-height: 1.15;
      color: #ffffff;
      text-shadow:
        0 0 18px rgba(255, 110, 199, 0.55),
        0 0 42px rgba(255, 45, 138, 0.35);
      margin-bottom: 24px;
      letter-spacing: 0.01em;
    }

    .intro-mascot {
      width: clamp(132px, 34vw, 176px);
      height: clamp(132px, 34vw, 176px);
      margin-bottom: 22px;
      animation: floatGentle 3.2s ease-in-out infinite;
      filter: drop-shadow(0 0 22px rgba(255, 64, 140, 0.35));
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }

    .intro-subtitle {
      font-size: clamp(0.75rem, 2.2vw, 0.95rem);
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(255, 224, 240, 0.88);
      margin-bottom: 26px;
      text-shadow: 0 0 12px rgba(255, 105, 180, 0.5);
    }

    .enter-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 34px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 150, 205, 0.65);
      background: linear-gradient(135deg, #ff3385 0%, #c81d77 100%);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.74rem, 2vw, 0.86rem);
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 0 22px rgba(255, 46, 136, 0.6),
        0 0 48px rgba(255, 46, 136, 0.28),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      animation: btnPulse 2.4s ease-in-out infinite;
    }

    .enter-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 0 30px rgba(255, 55, 145, 0.85),
        0 0 64px rgba(255, 46, 136, 0.45),
        inset 0 1px 2px rgba(255, 255, 255, 0.45);
      filter: brightness(1.08);
    }

    .enter-btn:active {
      transform: scale(0.97);
    }

    @keyframes btnPulse {
      0%, 100% {
        box-shadow:
          0 0 20px rgba(255, 46, 136, 0.58),
          0 0 44px rgba(255, 46, 136, 0.26);
      }
      50% {
        box-shadow:
          0 0 32px rgba(255, 70, 160, 0.82),
          0 0 64px rgba(255, 46, 136, 0.42);
      }
    }

    /* Subtle Hint Pill (fades after interaction) */
    #galaxy-hint {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 7px 16px;
      border-radius: 9999px;
      background: rgba(18, 8, 26, 0.55);
      border: 1px solid rgba(255, 105, 180, 0.28);
      backdrop-filter: blur(8px);
      font-size: 0.74rem;
      letter-spacing: 0.06em;
      color: rgba(255, 224, 242, 0.85);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      white-space: nowrap;
    }

    #galaxy-hint.visible {
      opacity: 1;
    }

    /* Bottom-Center Floating Heart / Audio Toggle (matches video UI) */
    #audio-toggle {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      z-index: 15;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255, 160, 210, 0.45);
      background: rgba(255, 255, 255, 0.94);
      color: #ff2a7a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 42, 122, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    #audio-toggle.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    #audio-toggle:hover {
      transform: translateX(-50%) scale(1.08);
      box-shadow: 0 6px 26px rgba(255, 42, 122, 0.7);
    }

    #audio-toggle.muted {
      background: rgba(34, 18, 42, 0.82);
      color: rgba(255, 175, 210, 0.6);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    #audio-toggle.playing svg {
      animation: heartBeat 1.4s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      18% { transform: scale(1.18); }
      34% { transform: scale(1); }
      50% { transform: scale(1.12); }
      68% { transform: scale(1); }
    }

    /* Memory Modal */
    #memory-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(4, 2, 10, 0.66);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    #memory-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      border-radius: 24px;
      padding: 20px 22px 24px;
      background: linear-gradient(180deg, rgba(28, 12, 34, 0.92) 0%, rgba(12, 6, 18, 0.95) 100%);
      border: 1px solid rgba(255, 105, 180, 0.45);
      box-shadow:
        0 0 36px rgba(255, 42, 128, 0.32),
        0 20px 60px rgba(0, 0, 0, 0.75);
      text-align: center;
      transform: translateY(18px) scale(0.95);
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #memory-modal.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-top-heart {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 65, 145, 0.16);
      border: 1px solid rgba(255, 120, 185, 0.4);
      margin-bottom: 14px;
      color: #ff66a8;
      font-size: 0.85rem;
    }

    .modal-art-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #07030c;
      border: 1px solid rgba(255, 130, 195, 0.22);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-art-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .modal-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      text-shadow: 0 0 14px rgba(255, 105, 180, 0.45);
    }

    .modal-message {
      font-size: 0.93rem;
      line-height: 1.6;
      color: rgba(255, 232, 245, 0.88);
      margin-bottom: 22px;
      padding: 0 6px;
    }

    .modal-close-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 26px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 120, 185, 0.55);
      background: rgba(255, 46, 136, 0.18);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .modal-close-btn:hover {
      background: rgba(255, 46, 136, 0.36);
      transform: translateY(-1px);
      box-shadow: 0 0 18px rgba(255, 46, 136, 0.45);
    }
  </style>
</head>
<body>
  <canvas id="galaxy-canvas"></canvas>

  <!-- Landing / Intro Screen -->
  <div id="intro-screen">
    <h1 class="intro-title">A Galaxy of<br />Love for You</h1>

    <!-- Cute Kawaii Puppy Hugging a Glowing Red Heart -->

        <!-- Floppy Ears -->

        <!-- Puppy Body -->

        <path d="M98 186 C98 186 44 152 44 119 C44 100 59 88 75 88 C86 88 94 94 98 102 C102 94 110 88 121 88 C137 88 152 100 152 119 C152 152 98 186 98 186 Z"
              fill="url(#heartGlowIntro)" stroke="#ffffff" stroke-width="2.2" filter="url(#softGlowIntro)" />
        <!-- Heart Gloss Highlight -->
        <path d="M62 106 C56 112 56 122 61 128" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />

        <!-- Hugging Paws -->
        <ellipse cx="78" cy="112" rx="13" ry="9" transform="rotate(-18 78 112)" fill="#ffffff" stroke="#24192b" stroke-width="2.8" />
        <ellipse cx="128" cy="144" rx="15" ry="10" transform="rotate(14 128 144)" fill="#ffffff" stroke="#24192b" stroke-width="2.8" />
        <!-- Feet -->
        <ellipse cx="112" cy="186" rx="14" ry="9" fill="#ffffff" stroke="#24192b" stroke-width="2.8" />
        <ellipse cx="140" cy="184" rx="13" ry="8.5" fill="#ffffff" stroke="#24192b" stroke-width="2.8" />
      </svg>
    </div>

    <p class="intro-subtitle">Every Star Belongs to You, My Love</p>

    <button id="enter-btn" class="enter-btn" type="button">
      Enter Our Universe
    </button>
  </div>

  <!-- Subtle Interactive Hint -->
  <div id="galaxy-hint">Drag to explore • Tap the orbiting memories ✨</div>

  <!-- Floating Bottom Heart / Audio Toggle -->
  <button id="audio-toggle" type="button" aria-label="Toggle romantic music" title="Music">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
    </svg>
  </button>

  <!-- Romantic Memory Card Modal -->
  <div id="memory-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-top-heart" aria-hidden="true">♥</div>
      <div class="modal-art-wrap" id="modal-art"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-message" id="modal-message"></p>
      <button id="modal-close-btn" class="modal-close-btn" type="button">
        Back ❤️
      </button>
    </div>
  </div>

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioCtx) {
            audioCtx = new AudioContextClass();
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            masterGain.connect(audioCtx.destination);
          }
          if (audioCtx.state === 'suspended') {

          }

              [196.00, 246.94, 293.66, 392.00]  // G6
            ];
            let step = 0;

            const playChord = () => {
              if (!audioCtx || !isMusicPlaying) return;
              const now = audioCtx.currentTime;
              const notes = chords[step % chords.length];
              step++;

              notes.forEach((freq, idx) => {

                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq * 0.5, now);

                g.gain.linearRampToValueAtTime(0.11, now + 0.8);

                const startT = now + idx * 0.42;

      // ==========================================================
      // 8. ORBITING 3D ROMANTIC PHRASES
      // ==========================================================
      function createTextSprite(text) {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 112;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);

        ctx.font = '600 34px "Inter", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#ff2a8a';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#ffe8f4';
        ctx.fillText(text, c.width / 2, c.height / 2);
        // Second crisp pass
        ctx.shadowBlur = 6;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(text, c.width / 2, c.height / 2);

        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        const mat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          opacity: 0.94,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(4.8, 1.05, 1);
        return sprite;
      }

      const phraseSprites = [];
      PHRASES.forEach((phrase, idx) => {
        const sprite = createTextSprite(phrase);
        const ring = idx % 3;
        const radius = ring === 0 ? 7.4 : (ring === 1 ? 12.6 : 16.8);
        const angle = (idx / PHRASES.length) * Math.PI * 2 + ring * 0.5;
        const yOffset = (ring - 1) * 0.55 + (Math.random() - 0.5) * 0.7;

        sprite.userData = {
          radius,
          angle,
          yOffset,
          speed: 0.0014 + (2 - ring) * 0.00055
        };
        sprite.position.set(
          Math.cos(angle) * radius,
          yOffset,
          Math.sin(angle) * radius
        );
        universeGroup.add(sprite);
        phraseSprites.push(sprite);
      });

      // ==========================================================
      // 9. ORBITING CLICKABLE MEMORY CARDS (RAYCASTABLE SPRITES)
      // ==========================================================
      function createMemoryCardSprite(memory) {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 256, 256);

        // Soft glowing circular aura
        const aura = ctx.createRadialGradient(128, 128, 22, 128, 128, 118);
        aura.addColorStop(0, 'rgba(255, 110, 185, 0.55)');
        aura.addColorStop(0.55, 'rgba(255, 45, 138, 0.22)');
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = aura;
        ctx.fillRect(0, 0, 256, 256);

        // Circular dark badge with glowing pink border
        ctx.save();
        ctx.beginPath();
        ctx.arc(128, 128, 72, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(20, 8, 28, 0.92)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = memory.iconColor;
        ctx.shadowColor = memory.iconColor;
        ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.restore();

        // Draw cute distinctive miniature icon inside each badge
        ctx.save();
        ctx.translate(128, 124);
        if (memory.id === 'amor') {
          // Heart + bow silhouette
          ctx.fillStyle = '#ff2a6d';
          ctx.beginPath();
          ctx.moveTo(0, 30);
          ctx.bezierCurveTo(-42, 4, -40, -32, -16, -32);
          ctx.bezierCurveTo(-4, -32, 0, -22, 0, -16);
          ctx.bezierCurveTo(0, -22, 4, -32, 16, -32);
          ctx.bezierCurveTo(40, -32, 42, 4, 0, 30);
          ctx.fill();
          // Sparkle
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-14, -14, 5, 0, Math.PI * 2);
          ctx.fill();
        } else if (memory.id === 'parati') {
          // Cute white puppy head
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(0, 6, 30, 24, 0, 0, Math.PI * 2);
          ctx.fill();
          // Ears
          ctx.fillStyle = '#24142c';
          ctx.beginPath();
          ctx.ellipse(-28, 4, 9, 16, 0.3, 0, Math.PI * 2);
          ctx.ellipse(28, 4, 9, 16, -0.3, 0, Math.PI * 2);
          ctx.fill();
          // Eyes & Nose
          ctx.fillStyle = '#180d1e';
          ctx.beginPath();
          ctx.arc(-10, 4, 3.5, 0, Math.PI * 2);
          ctx.arc(10, 4, 3.5, 0, Math.PI * 2);
          ctx.arc(0, 11, 3.8, 0, Math.PI * 2);
          ctx.fill();
          // Floating tiny pink heart above
          ctx.fillStyle = '#ff4fa3';
          ctx.beginPath();
          ctx.arc(-5, -26, 6, 0, Math.PI * 2);
          ctx.arc(5, -26, 6, 0, Math.PI * 2);
          ctx.moveTo(-11, -24);
          ctx.lineTo(0, -13);
          ctx.lineTo(11, -24);
          ctx.fill();
        } else if (memory.id === 'parasiempre') {
          // Golden radiant heart
          const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 38);
          g.addColorStop(0, '#fff7cc');
          g.addColorStop(0.55, '#ffb84d');
          g.addColorStop(1, '#e65c8a');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(0, 32);
          ctx.bezierCurveTo(-44, 6, -42, -32, -16, -32);
          ctx.bezierCurveTo(-4, -32, 0, -22, 0, -16);
          ctx.bezierCurveTo(0, -22, 4, -32, 16, -32);
          ctx.bezierCurveTo(42, -32, 44, 6, 0, 32);
          ctx.fill();
        } else {
          // Birthday star + heart
          ctx.fillStyle = '#ff3385';
          ctx.beginPath();
          ctx.moveTo(0, 30);
          ctx.bezierCurveTo(-40, 4, -38, -30, -15, -30);
          ctx.bezierCurveTo(-4, -30, 0, -20, 0, -14);
          ctx.bezierCurveTo(0, -20, 4, -30, 15, -30);
          ctx.bezierCurveTo(38, -30, 40, 4, 0, 30);
          ctx.fill();
          ctx.fillStyle = '#fff0a8';
          ctx.font = 'bold 26px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('✨', 0, -26);
        }
        ctx.restore();

        // Small label underneath
        ctx.font = '600 20px "Inter", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffeaf5';
        ctx.shadowColor = '#ff2e88';
        ctx.shadowBlur = 10;
        ctx.fillText(memory.title, 128, 224);

        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        const mat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(2.85, 2.85, 1);
        sprite.userData = {
          memory,
          angle: memory.angle,
          radius: memory.radius,
          yOffset: memory.yOffset,
          speed: 0.0018,
          baseScale: 2.85
        };
        sprite.position.set(
          Math.cos(memory.angle) * memory.radius,
          memory.yOffset,
          Math.sin(memory.angle) * memory.radius
        );
        return sprite;
      }

      const memorySprites = [];
      MEMORIES.forEach((m) => {
        const sp = createMemoryCardSprite(m);
        universeGroup.add(sp);
        memorySprites.push(sp);
      });

      // ==========================================================
      // 10. SMOOTH ORBIT CAMERA & INTERACTION (MOUSE + TOUCH)
      // ==========================================================
      let appState = 'intro'; // 'intro' | 'warp' | 'galaxy'
      let warpProgress = 0;

      // Spherical camera target state
      let targetTheta = 0.25;
      let targetPhi = 1.18; // Slightly above galaxy disk
      let targetRadius = 22.5;
      let currentTheta = targetTheta;
      let currentPhi = targetPhi;
      let currentRadius = targetRadius;

      let isDragging = false;
      let pointerDownPos = { x: 0, y: 0 };
      let lastPointerPos = { x: 0, y: 0 };
      let didDrag = false;
      let pinchStartDist = 0;
      let pinchStartRadius = targetRadius;
      let hoveredSprite = null;

      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();

      function updatePointerNDC(clientX, clientY) {
        pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (appState !== 'galaxy' || modal.classList.contains('open')) return;
        isDragging = true;
        didDrag = false;
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        lastPointerPos.x = e.clientX;
        lastPointerPos.y = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        if (appState !== 'galaxy') return;

        if (isDragging) {
          const dx = e.clientX - lastPointerPos.x;
          const dy = e.clientY - lastPointerPos.y;
          if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 5) {
            didDrag = true;
          }
          targetTheta -= dx * 0.0058;
          targetPhi = Math.max(0.35, Math.min(Math.PI * 0.48, targetPhi - dy * 0.0045));
          lastPointerPos.x = e.clientX;
          lastPointerPos.y = e.clientY;
          return;
        }

        if (!modal.classList.contains('open')) {
          updatePointerNDC(e.clientX, e.clientY);
          raycaster.setFromCamera(pointerNDC, camera);
          const hits = raycaster.intersectObjects(memorySprites);
          if (hits.length > 0) {
            hoveredSprite = hits[0].object;
            canvas.style.cursor = 'pointer';
          } else {
            hoveredSprite = null;
            canvas.style.cursor = 'grab';
          }
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        if (appState === 'galaxy' && !didDrag && !modal.classList.contains('open')) {
          updatePointerNDC(e.clientX, e.clientY);
          raycaster.setFromCamera(pointerNDC, camera);
          const hits = raycaster.intersectObjects(memorySprites);
          if (hits.length > 0) {
            openMemoryModal(hits[0].object.userData.memory);
          }
        }
      });

      canvas.addEventListener('wheel', (e) => {
        if (appState !== 'galaxy' || modal.classList.contains('open')) return;
        e.preventDefault();
        targetRadius = Math.max(10, Math.min(36, targetRadius + e.deltaY * 0.018));
      }, { passive: false });

      // Two-finger pinch zoom
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2 && appState === 'galaxy') {
          isDragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchStartDist = Math.hypot(dx, dy);
          pinchStartRadius = targetRadius;
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && appState === 'galaxy' && pinchStartDist > 0) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          const scale = pinchStartDist / Math.max(dist, 1);
          targetRadius = Math.max(10, Math.min(36, pinchStartRadius * scale));
        }
      }, { passive: true });

      // ==========================================================
      // 11. MODAL & INTRO TRANSITION CONTROLS
      // ==========================================================
      const introScreen = document.getElementById('intro-screen');
      const enterBtn = document.getElementById('enter-btn');
      const galaxyHint = document.getElementById('galaxy-hint');
      const modal = document.getElementById('memory-modal');
      const modalArt = document.getElementById('modal-art');
      const modalTitle = document.getElementById('modal-title');
      const modalMessage = document.getElementById('modal-message');
      const modalCloseBtn = document.getElementById('modal-close-btn');

      function openMemoryModal(memory) {
        modalArt.innerHTML = memory.svg;
        modalTitle.textContent = memory.title;
        modalMessage.textContent = memory.message;
        modal.classList.add('open');
        galaxyHint.classList.remove('visible');
      }

      function closeMemoryModal() {
        modal.classList.remove('open');
      }

      modalCloseBtn.addEventListener('click', closeMemoryModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeMemoryModal();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) {
          closeMemoryModal();
        }
      });

      enterBtn.addEventListener('click', () => {
        if (appState !== 'intro') return;
        appState = 'warp';
        warpProgress = 0;
        introScreen.classList.add('fade-out');
        startRomanticMusic();

        setTimeout(() => {
          introScreen.style.display = 'none';
        }, 950);
      });

      // ==========================================================
      // 12. ANIMATION LOOP
      // ==========================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.getElapsedTime();

        // Subtle background star drift
        bgStars.rotation.y += dt * 0.015;

        if (appState === 'intro') {
          camera.position.set(0, 0, 26);
          camera.lookAt(0, 0, 0);
        } else if (appState === 'warp') {
          warpProgress += dt * 0.48; // ~2.1 seconds total warp

          // Rush warp stars past camera
          const posAttr = warpGeo.attributes.position;
          for (let i = 0; i < warpCount; i++) {
            let z = posAttr.getZ(i) + dt * 115;
            if (z > 40) z = -100;
            posAttr.setZ(i, z);
          }
          posAttr.needsUpdate = true;

          // Fade warp in then out
          if (warpProgress < 0.65) {
            warpMat.opacity = Math.min(0.95, warpProgress * 2.4);
          } else {
            warpMat.opacity = Math.max(0, (1 - warpProgress) / 0.35);
          }

          // Bloom galaxy into view near end of warp
          if (warpProgress > 0.42) {
            universeGroup.visible = true;
            const bloom = Math.min(1, (warpProgress - 0.42) / 0.58);
            const eased = 1 - Math.pow(1 - bloom, 3);
            universeGroup.scale.set(eased, eased, eased);
          }

          camera.position.set(0, 8 * Math.min(1, warpProgress), 26 - 4 * Math.min(1, warpProgress));
          camera.lookAt(0, 1.8, 0);

          if (warpProgress >= 1) {
            appState = 'galaxy';
            warpMat.opacity = 0;
            warpTunnel.visible = false;
            universeGroup.scale.set(1, 1, 1);
            audioToggleBtn.classList.add('visible');
            galaxyHint.classList.add('visible');
            setTimeout(() => galaxyHint.classList.remove('visible'), 6500);
          }
        } else if (appState === 'galaxy') {
          // Gentle auto-orbit when user isn't dragging or reading a modal
          if (!isDragging && !modal.classList.contains('open')) {
            targetTheta += dt * 0.095;
          }

          currentTheta += (targetTheta - currentTheta) * Math.min(1, dt * 6);
          currentPhi += (targetPhi - currentPhi) * Math.min(1, dt * 6);
          currentRadius += (targetRadius - currentRadius) * Math.min(1, dt * 6);

          camera.position.x = currentRadius * Math.sin(currentPhi) * Math.sin(currentTheta);
          camera.position.y = currentRadius * Math.cos(currentPhi) + 2.0;
          camera.position.z = currentRadius * Math.sin(currentPhi) * Math.cos(currentTheta);
          camera.lookAt(0, 1.9, 0);
        }

        if (universeGroup.visible) {
          // Rotate spiral galaxy
          galaxyPoints.rotation.y += dt * 0.14;
          photonRing.rotation.z -= dt * 0.5;

          // Pulse & slowly rotate the giant 3D particle heart
          const beat = 1 + Math.sin(elapsed * 2.6) * 0.045 + Math.sin(elapsed * 5.2) * 0.018;
          bigHeartPoints.scale.set(beat, beat, beat);
          bigHeartPoints.rotation.y = Math.sin(elapsed * 0.65) * 0.35;
          bigHeartPoints.position.y = 5.2 + Math.sin(elapsed * 1.4) * 0.25;

          // Animate floating mini 3D hearts
          for (let i = 0; i < heartGroup.length; i++) {
            const hm = heartGroup[i];
            hm.userData.angle += hm.userData.orbitSpeed;
            hm.position.x = Math.cos(hm.userData.angle) * hm.userData.radius;
            hm.position.z = Math.sin(hm.userData.angle) * hm.userData.radius;
            hm.position.y = hm.userData.yOffset + Math.sin(elapsed * 1.5 + hm.userData.phase) * 0.65;
            hm.rotation.y += dt * 0.9;
          }

          // Orbit romantic phrases
          for (let i = 0; i < phraseSprites.length; i++) {
            const sp = phraseSprites[i];
            sp.userData.angle += sp.userData.speed;
            sp.position.x = Math.cos(sp.userData.angle) * sp.userData.radius;
            sp.position.z = Math.sin(sp.userData.angle) * sp.userData.radius;
            sp.position.y = sp.userData.yOffset + Math.sin(elapsed * 1.2 + i) * 0.18;
          }

          // Orbit clickable memory cards
          for (let i = 0; i < memorySprites.length; i++) {
            const sp = memorySprites[i];
            sp.userData.angle += sp.userData.speed;
            sp.position.x = Math.cos(sp.userData.angle) * sp.userData.radius;
            sp.position.z = Math.sin(sp.userData.angle) * sp.userData.radius;
            sp.position.y = sp.userData.yOffset + Math.sin(elapsed * 1.8 + i * 1.5) * 0.3;

            const targetSc = sp === hoveredSprite
              ? sp.userData.baseScale * 1.18
              : sp.userData.baseScale * (1 + Math.sin(elapsed * 2.5 + i) * 0.04);
            sp.scale.x += (targetSc - sp.scale.x) * 0.14;
            sp.scale.y += (targetSc - sp.scale.y) * 0.14;
          }
        }

        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      window.onload = () => {
        animate();
      };
    })();
  </script>
</body>
</html>
